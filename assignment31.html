<h1>Create a simple responsive menu bar using display:flex. </h1>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        /* Navigation Bar */
        nav {
            background: linear-gradient(90deg, #141e30, #243b55);
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Website Logo */
        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        /* Menu Items */
        .menu {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        .menu a:hover {
            color: #38bdf8;
        }

        /* Main Content */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            color: #243b55;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #475569;
            font-size: 18px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .menu {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">My<span>Website</span></div>

        <ul class="menu">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="hero" id="home">
        <h1>Welcome to My Website</h1>
        <p>A simple and responsive navigation menu using CSS Flexbox.</p>
    </section>

</body>
</html>
