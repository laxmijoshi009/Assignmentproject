<h1>17 . Build a job-application style form using every input type covered</h1>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>
    <p>Please fill in your details below.</p>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="password">Create Password:</label>
            <input type="password" id="password" name="password">
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
            <br><br>

            <label for="time">Preferred Interview Time:</label>
            <input type="time" id="time" name="time">
            <br><br>

            <label for="website">Portfolio Website:</label>
            <input type="url" id="website" name="website">
            <br><br>

            <label for="search">Search Job Role:</label>
            <input type="search" id="search" name="search">
            <br><br>
        </fieldset>

        <fieldset>
            <legend>Job Details</legend>

            <label for="position">Position:</label>
            <select id="position" name="position">
                <option value="">Select Position</option>
                <option value="web">Web Developer</option>
                <option value="java">Java Developer</option>
                <option value="ai">AI Intern</option>
                <option value="design">UI Designer</option>
            </select>
            <br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
            <br><br>

            <label for="experience">Years of Experience:</label>
            <input type="number" id="experience" name="experience" min="0" max="50">
            <br><br>

            <label for="salary">Expected Salary:</label>
            <input type="range" id="salary" name="salary"
                   min="10000" max="100000" step="5000" value="30000">
            <br><br>

            <label for="color">Choose a Preferred Theme Color:</label>
            <input type="color" id="color" name="color">
            <br><br>

            <label for="interview">Available Interview Date:</label>
            <input type="datetime-local" id="interview" name="interview">
            <br><br>

            <label for="month">Available Starting Month:</label>
            <input type="month" id="month" name="month">
            <br><br>

            <label for="week">Preferred Training Week:</label>
            <input type="week" id="week" name="week">
            <br><br>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume">
            <br><br>

            <label for="skills">Skills:</label><br>
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="java" name="skills" value="Java">
            <label for="java">Java</label>

            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label>
            <br><br>

            <label for="cover">Cover Letter:</label><br>
            <textarea id="cover" name="cover" rows="5" cols="40"></textarea>
            <br><br>

            <input type="hidden" name="formType" value="jobApplication">

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I confirm that the information is correct.</label>
            <br><br>
        </fieldset>

        <br>
        <input type="submit" value="Apply Now">
        <input type="reset" value="Clear Form">
        <input type="button" value="Click Me"
               onclick="alert('Thank you for your interest!')">

        <br><br>

        <label for="imageSubmit">Image Submit Button:</label>
        <input type="image" id="imageSubmit"
               alt="Submit application"
               width="80" height="30"
               src="https://placehold.co/80x30/007bff/ffffff?text=Submit">

    </form>

</body>
</html>
