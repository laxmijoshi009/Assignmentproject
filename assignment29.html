<h1>29 .Style a landing-page hero section using position and z-index. </h1>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Overflow Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f1f5f9;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            overflow-wrap: anywhere;
        }

        .card {
            width: 100%;
            max-width: 100%;
            padding: 20px;
            background: #dbeafe;
            border: 2px solid #2563eb;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Overflow Fixed</h1>

        <div class="card">
            <h2>Responsive Card</h2>
            <p>
                This card fits inside its container without
                breaking the page layout on smaller screens.
            </p>

            <p>
                Long text example:
                ThisIsAVeryLongWordThatCouldOtherwiseBreakTheLayout
            </p>
        </div>
    </div>

</body>
</html>
