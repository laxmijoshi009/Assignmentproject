<h1>39 Build a responsive product grid with a header and sidebar using Grid.</h1>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive student dashboard built using CSS Grid">
  <title>Student Dashboard | Grid Project</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    /* Main Grid Layout */
    .dashboard {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: 75px 1fr 55px;
      grid-template-areas:
        "sidebar header"
        "sidebar main"
        "sidebar footer";
    }

    /* Sidebar */
    .sidebar {
      grid-area: sidebar;
      background: #172554;
      color: white;
      padding: 28px 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .sidebar nav a {
      display: block;
      color: #cbd5e1;
      text-decoration: none;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: #2563eb;
      color: white;
    }

    /* Header */
    .header {
      grid-area: header;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 30px;
      box-shadow: 0 2px 8px #00000008;
      gap: 15px;
    }
